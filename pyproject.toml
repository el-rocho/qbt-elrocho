[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qbt-elrocho"
version = "0.1.0"
description = "Organización y envío de archivos .torrent a una instancia local o remota de qBittorrent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "el-rocho" }]
dependencies = ["PySide6>=6.6"]

[project.scripts]
qbt-elrocho = "qbt.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qbt = ["assets/*.png"]
